services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-codora}
      POSTGRES_USER: ${POSTGRES_USER:-codora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-1234321}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - codora-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-codora} -d ${POSTGRES_DB:-codora}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-codora}:${POSTGRES_PASSWORD:-1234321}@postgres:5432/${POSTGRES_DB:-codora}
      - API_HOST=0.0.0.0
      - API_PORT=3001
      - JWT_SECRET=${JWT_SECRET:-12345678901234567890123456789012}
      - COOKIE_SECURE=false
      - FRONTEND_ORIGIN=${FRONTEND_ORIGIN:-http://localhost:5173}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-6-luna}
      - ASSESSMENT_RUNNER_URL=http://assessment-runner:3002
      - ASSESSMENT_RUNNER_TOKEN=${ASSESSMENT_RUNNER_TOKEN:-codora-local-grader}
    depends_on:
      postgres:
        condition: service_healthy
      assessment-runner:
        condition: service_started
    volumes:
      - ./backend/app:/app/app
      - ./backend/data:/app/data

  assessment-runner:
    build: ./backend/assessment_runner
    environment:
      - ASSESSMENT_RUNNER_TOKEN=${ASSESSMENT_RUNNER_TOKEN:-codora-local-grader}
    ports:
      - "127.0.0.1:3002:3002"
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    mem_limit: 384m
    cpus: 1
    pids_limit: 32
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, KILL]
    security_opt:
      - no-new-privileges:true

volumes:
  codora-postgres:
