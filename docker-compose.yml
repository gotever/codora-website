services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-codora}
      POSTGRES_USER: ${POSTGRES_USER:-codora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - codora-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-codora} -d ${POSTGRES_DB:-codora}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  codora-postgres:
