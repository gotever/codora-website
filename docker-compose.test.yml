# Isolated services for running the backend test suite.
# Separate project name, ports and no volumes: it never touches the dev database.
#
#   docker compose -f docker-compose.test.yml up -d --build --wait
#   docker compose -f docker-compose.test.yml down
#
# See docs/testing/test-environment.md for the full test commands.
name: codora-test

services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: codora_test
      POSTGRES_USER: codora
      POSTGRES_PASSWORD: codora-test-only
    ports:
      - "127.0.0.1:5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codora -d codora_test"]
      interval: 2s
      timeout: 3s
      retries: 15

  assessment-runner-test:
    build: ./backend/assessment_runner
    environment:
      - ASSESSMENT_RUNNER_TOKEN=codora-test-grader
    ports:
      - "127.0.0.1:3012:3002"
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    mem_limit: 384m
    cpus: 1
    pids_limit: 32
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, KILL]
    security_opt:
      - no-new-privileges:true
